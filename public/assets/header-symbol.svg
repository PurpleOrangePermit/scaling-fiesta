<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="blue" x1="0" y1=".55" x2="1" y2=".75">
      <stop stop-color="#1835ff"/>
      <stop offset=".58" stop-color="#1730ed"/>
      <stop offset="1" stop-color="#8f79ff" stop-opacity=".66"/>
    </linearGradient>
    <radialGradient id="mint" cx="79%" cy="4%" r="70%">
      <stop stop-color="#91ffdc"/>
      <stop offset=".43" stop-color="#24c8ff" stop-opacity=".94"/>
      <stop offset="1" stop-color="#2754fc" stop-opacity="0"/>
    </radialGradient>
    <path id="spot" d="M6 40C8 27 31 20 55 12c23-7 43-9 54 8 10 15 5 41-10 50-16 9-41 5-62-2C18 62 4 52 6 40Z"/>
    <filter id="edge" x="-15%" y="-20%" width="130%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence baseFrequency=".88" numOctaves="3" seed="10" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#edge)">
    <use href="#spot" fill="url(#blue)"/>
    <use href="#spot" fill="url(#mint)"/>
    <use href="#spot" filter="url(#texture)" style="mix-blend-mode:soft-light"/>
  </g>
  <g fill="#fff" transform="translate(42 26) scale(.77) skewX(18)">
    <rect width="12" height="18" x="4" rx="1.6"/>
    <rect width="12" height="18" x="28" rx="1.6"/>
    <rect width="12" height="18" x="-8" y="18" rx="1.6"/>
    <rect width="12" height="18" x="16" y="18" rx="1.6"/>
  </g>
</svg>
